name: Java Build Automation

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Manifest File
        run: echo "Main-Class: App" > manifest.txt

      - name: Compile Application
        run: |
          if [ -d "Pacman-Game Java" ]; then
            cd "Pacman-Game Java"
          fi
          javac App.java PacMan.java

      - name: Package Executable JAR
        run: |
          if [ -d "Pacman-Game Java" ]; then
            cd "Pacman-Game Java"
          fi
          jar cfm ../PacmanGame.jar ../manifest.txt *.class *.png

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Game-Build
          path: PacmanGame.jar
