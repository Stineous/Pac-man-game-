name: Java CI Build & Package

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Manifest File
      run: echo "Main-Class: App" > manifest.txt

    - name: Compile Java Files
      run: javac App.java PacMan.java

    - name: Package Standalone Executable JAR
      run: jar cfm PacmanGame.jar manifest.txt *.class *.png

    - name: Upload Built JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pacman-Game-Build
        path: PacmanGame.jar
